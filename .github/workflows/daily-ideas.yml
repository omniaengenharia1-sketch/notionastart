name: 💡 Ideias de Conteúdo — Astart Studio

on:
  schedule:
    # 09:00 BRT = 12:00 UTC (Brasil usa UTC-3)
    - cron: "0 12 * * *"
  # Permite rodar manualmente pelo GitHub Actions
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não posta no Notion, só mostra o output)"
        required: false
        default: "false"
        type: boolean

jobs:
  generate-ideas:
    name: Gerar e postar ideias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar ideias de conteúdo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/generate_ideas.py

      - name: Notificar falha
        if: failure()
        run: echo "::error::Pipeline de ideias falhou. Verifique os logs acima."
